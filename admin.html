<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | Navaa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-header {
      position: relative;
      background: radial-gradient(ellipse at 30% 0%, rgba(0,240,212,.15), transparent 55%),
                  radial-gradient(ellipse at 70% 100%, rgba(56,189,248,.15), transparent 55%),
                  linear-gradient(180deg, #0a0a0a 0%, #141414 100%);
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(0,240,212,.15);
      z-index: 10;
    }
    .admin-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 5%; right: 5%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--turquoise), var(--sky), var(--gold), var(--red), transparent);
      box-shadow: 0 0 12px var(--turquoise);
    }
    .admin-header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .admin-logo-box { display: flex; align-items: center; gap: .5rem; text-decoration: none; }
    .admin-badge-large {
      display: inline-flex; align-items: center; gap: .4rem;
      background: linear-gradient(135deg, rgba(255,201,60,.15), rgba(255,140,0,.1));
      border: 1px solid rgba(255,201,60,.5); color: var(--gold);
      padding: .5rem 1.1rem; border-radius: 999px;
      font-size: .82rem; font-weight: 800; box-shadow: 0 0 16px rgba(255,201,60,.3);
    }
    .admin-back-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      background: linear-gradient(135deg, var(--turquoise), var(--sky));
      color: #001a1c !important; text-decoration: none;
      padding: .8rem 1.5rem; border-radius: 999px;
      font-size: .92rem; font-weight: 800; box-shadow: 0 4px 20px rgba(0,240,212,.5);
      transition: all .25s;
    }
    .admin-back-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 0 1px rgba(0,240,212,.8), 0 8px 32px rgba(0,240,212,.7); }
    .admin-main { padding-bottom: 120px !important; }
    .admin-section { background: var(--black-2); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; max-width: 500px; }
    .admin-section h3 { margin: 0 0 1.2rem; font-size: 1rem; color: #fff; font-weight: 800; }
    .btn-delete-user {
      background: linear-gradient(135deg, #ff2e4d, #8b0000); color: #fff;
      border: none; padding: .45rem .8rem; border-radius: 8px;
      font-family: inherit; font-size: .75rem; font-weight: 700;
      cursor: pointer; transition: .2s; flex: 1; min-width: 90px;
      box-shadow: 0 0 12px rgba(255,46,77,.4);
    }
    .btn-delete-user:hover { filter: brightness(1.15); transform: scale(1.02); }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="home.html" class="admin-logo-box">
        <span class="logo-icon-sm">🎵</span>
        <span class="logo-name-sm">Navaa<span class="dot">.</span></span>
      </a>
      <div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;">
        <span class="admin-badge-large">🛡️ پنل مدیریت</span>
        <a href="home.html" class="admin-back-btn" id="backBtn">
          <span class="admin-back-btn-icon">🎨</span>
          <span>رفتن به گالری</span>
        </a>
      </div>
    </div>
  </header>

  <main class="admin-main" id="adminMain" style="display:none;">
    <h1 class="admin-title">🛡️ پنل مدیریت Navaa</h1>
    <p class="admin-sub">مدیریت کاربران، آثار، پرداخت‌ها و برداشت‌ها</p>

    <div class="admin-stats">
      <div class="stat-box"><strong id="statUsers">0</strong><span>👥 کاربر</span></div>
      <div class="stat-box"><strong id="statAdmins">0</strong><span>🛡️ ادمین</span></div>
      <div class="stat-box"><strong id="statItems">0</strong><span>🖼️ اثر</span></div>
      <div class="stat-box"><strong id="statPending">0</strong><span>⏳ در انتظار</span></div>
      <div class="stat-box"><strong id="statCommission">0</strong><span>💰 درآمد مدیر</span></div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="users">👥 کاربران</button>
      <button class="admin-tab" data-tab="items">🖼️ آثار</button>
      <button class="admin-tab" data-tab="payments">💳 پرداخت‌ها</button>
      <button class="admin-tab" data-tab="withdraws">💸 برداشت‌ها</button>
      <button class="admin-tab" data-tab="settings">⚙️ تنظیمات</button>
    </div>

    <section id="tab-users" class="admin-panel">
      <div class="admin-search"><input type="text" id="userSearch" placeholder="🔍 جستجو..."></div>
      <div class="users-grid" id="usersGrid"></div>
    </section>

    <section id="tab-items" class="admin-panel hidden">
      <div class="admin-search"><input type="text" id="itemSearch" placeholder="🔍 جستجو در آثار..."></div>
      <div class="items-grid" id="adminItems"></div>
    </section>

    <section id="tab-payments" class="admin-panel hidden"><div id="paymentsList"></div></section>
    <section id="tab-withdraws" class="admin-panel hidden"><div id="withdrawsList"></div></section>

    <section id="tab-settings" class="admin-panel hidden">
      <div class="admin-section">
        <h3>⚙️ تنظیمات پلتفرم</h3>
        <div style="margin-bottom:1rem;">
          <label style="display:block;font-size:.85rem;color:#fff;margin-bottom:.4rem;font-weight:700;">درصد کمیسیون مدیر (٪):</label>
          <input type="number" id="commissionInput" min="0" max="50" value="15" style="width:100%;padding:.7rem;background:var(--black-3);border:1px solid var(--border);border-radius:10px;color:#fff;font-family:inherit;font-size:.95rem;outline:none;">
        </div>
        <div style="margin-bottom:1rem;">
          <label style="display:block;font-size:.85rem;color:#fff;margin-bottom:.4rem;font-weight:700;">حداکثر قیمت اثر (تومان):</label>
          <input type="number" id="maxPriceInput" min="10000" step="10000" value="500000" style="width:100%;padding:.7rem;background:var(--black-3);border:1px solid var(--border);border-radius:10px;color:#fff;font-family:inherit;font-size:.95rem;outline:none;">
        </div>
        <button id="saveSettingsBtn" class="btn-primary" style="padding:.8rem 1.5rem;">💾 ذخیره</button>
      </div>
    </section>
  </main>

  <div id="loadingBox" style="text-align:center; padding:5rem 1rem; color:#fff;">
    <h2>⏳ در حال دریافت اطلاعات از سرور...</h2>
  </div>

  <div id="giftModal" class="modal hidden">
    <div class="modal-content sub-content" style="max-width:900px;">
      <button class="modal-close" id="giftClose">✕</button>
      <div class="sub-icon" style="font-size:2.5rem;">🎁</div>
      <h2>هدیه اشتراک</h2>
      <p class="sub-desc">برای <strong id="giftUserName" style="color:#00f0d4;"></strong></p>
      <div class="plans" style="margin-top:1rem;">
        <div class="plan plan-bronze" data-plan="bronze" data-days="30">
          <div class="plan-header"><span class="plan-name">🥉 برنزی</span><div class="plan-duration">۱ ماهه</div></div>
          <button class="plan-btn" style="font-size:.8rem;padding:.6rem;">🎁 هدیه</button>
        </div>
        <div class="plan plan-silver" data-plan="silver" data-days="180">
          <div class="plan-header"><span class="plan-name">🥈 طلایی</span><div class="plan-duration">۶ ماهه</div></div>
          <button class="plan-btn" style="font-size:.8rem;padding:.6rem;">🎁 هدیه</button>
        </div>
        <div class="plan plan-diamond" data-plan="diamond" data-days="540">
          <div class="plan-header"><span class="plan-name">💎 الماسی</span><div class="plan-duration">۱ سال و ۶ ماه</div></div>
          <button class="plan-btn" style="font-size:.8rem;padding:.6rem;">🎁 هدیه</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script>
    const CURRENT_KEY = 'navaa_current_user';
    const USERS_KEY = 'navaa_users';
    const ITEMS_KEY = 'navaa_items_v3';
    const REQUESTS_KEY = 'navaa_payment_requests';
    const WITHDRAW_KEY = 'navaa_withdraw_requests';
    const SETTINGS_KEY = 'navaa_settings';
    const ADMIN_EMAIL = 'm.soroush.salari@gmail.com';

    let currentUser = JSON.parse(localStorage.getItem(CURRENT_KEY));
    let users = []; // مقدار اولیه خالی
    let items = [];
    let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || { commissionRate: 15, maxItemPrice: 500000, minItemPrice: 5000 };

    if (!currentUser || (currentUser.role !== 'admin' && currentUser.email !== ADMIN_EMAIL)) {
      alert('⛔ دسترسی نداری!');
      window.location.href = 'home.html'; // ✅ تغییر مسیر
    }

    const isSuperAdmin = currentUser ? (currentUser.email === ADMIN_EMAIL) : false;

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function formatMoney(n) { return Number(n || 0).toLocaleString('fa-IR'); }
    function getInitials(name) { if (!name) return '؟'; const parts = name.trim().split(' '); return parts.length === 1 ? parts[0].charAt(0) : parts[0].charAt(0) + ' ' + parts[parts.length-1].charAt(0); }

    function saveUsers() {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      const meIdx = users.findIndex(u => u.id === currentUser.id);
      if (meIdx !== -1) { currentUser = users[meIdx]; localStorage.setItem(CURRENT_KEY, JSON.stringify(currentUser)); }
    }
    function saveItems() { localStorage.setItem(ITEMS_KEY, JSON.stringify(items)); }

    (function setupSuperAdmin() {
      if (!currentUser) return;
      const admin = users.find(u => u.email === ADMIN_EMAIL);
      if (admin) {
        let changed = false;
        if (admin.role !== 'admin') { admin.role = 'admin'; changed = true; }
        if (!admin.hasSubscription) { admin.hasSubscription = true; changed = true; }
        if (admin.subscriptionPlan !== 'diamond') { admin.subscriptionPlan = 'diamond'; admin.subscriptionExpiry = Date.now() + (36500 * 24 * 60 * 60 * 1000); changed = true; }
        if (!admin.balance) admin.balance = 5000000;
        if (changed) saveUsers();
      }
    })();

    function updateStats() {
      document.getElementById('statUsers').textContent = users.length;
      document.getElementById('statAdmins').textContent = users.filter(u => u.role === 'admin').length;
      document.getElementById('statItems').textContent = items.length;
      const requests = JSON.parse(localStorage.getItem(REQUESTS_KEY)) || [];
      const withdraws = JSON.parse(localStorage.getItem(WITHDRAW_KEY)) || [];
      const pending = requests.filter(r => r.status === 'pending').length + withdraws.filter(w => w.status === 'pending').length;
      document.getElementById('statPending').textContent = pending;
      const admin = users.find(u => u.email === ADMIN_EMAIL);
      document.getElementById('statCommission').textContent = formatMoney(admin?.totalCommission || 0);
    }

    document.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.add('hidden'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
        if (tab.dataset.tab === 'payments') renderPayments();
        if (tab.dataset.tab === 'withdraws') renderWithdraws();
        if (tab.dataset.tab === 'settings') renderSettings();
      });
    });

    document.getElementById('userSearch').addEventListener('input', e => renderUsers(e.target.value.trim().toLowerCase()));
    document.getElementById('itemSearch').addEventListener('input', e => renderItems(e.target.value.trim().toLowerCase()));

    function renderUsers(search = '') {
      const grid = document.getElementById('usersGrid');
      grid.innerHTML = '';
      let sorted = [...users].sort((a, b) => b.joinDate - a.joinDate);
      if (search) sorted = sorted.filter(u => u.fullname.toLowerCase().includes(search) || u.email.toLowerCase().includes(search) || (u.phone || '').includes(search));
      if (sorted.length === 0) { grid.innerHTML = '<div class="empty-grid">کاربری پیدا نشد</div>'; return; }

      sorted.forEach((u) => {
        const isUserAdmin = u.role === 'admin' || u.email === ADMIN_EMAIL;
        const isSuper = u.email === ADMIN_EMAIL;
        const isMe = u.id === currentUser.id;
        let roleBadge = isSuper ? '<span class="role-badge role-super">👑 مدیر کل</span>' : (isUserAdmin ? '<span class="role-badge role-admin">🛡️ ادمین</span>' : '<span class="role-badge role-user">👤 کاربر</span>');
        let subBadge = u.hasSubscription ? `<span class="badge-yes">${ { bronze: '🥉 برنزی', silver: '🥈 طلایی', diamond: '💎 الماسی' }[u.subscriptionPlan] || '✅' }</span>` : '<span class="badge-no">❌ بدون اشتراک</span>';

        let actions = '';
        if (isSuperAdmin && !isMe && !isSuper) {
          if (isUserAdmin) actions += `<button class="btn-toggle admin-revoke" data-id="${u.id}">❌ حذف ادمین</button>`;
          else actions += `<button class="btn-toggle admin-promote" data-id="${u.id}">🛡️ ادمین کن</button>`;
        }
        if (isSuperAdmin && !isSuper) actions += `<button class="btn-gift" data-id="${u.id}">🎁 هدیه</button>`;
        if (isSuperAdmin && u.hasSubscription && !isSuper) actions += `<button class="btn-revoke-sub" data-id="${u.id}">🚫 لغو</button>`;
        if (isSuperAdmin && !isMe && !isSuper) actions += `<button class="btn-delete-user" data-delete="${u.id}">🗑️ حذف کامل</button>`;
        if (!actions) actions = '<span style="color:#555;font-size:.8rem;">—</span>';

        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `
          <div class="user-card-head">
            <div class="user-avatar">${escapeHtml(getInitials(u.fullname))}</div>
            <div class="user-main">
              <h4>${escapeHtml(u.fullname)} ${isMe ? '<small style="color:#00f0d4;">(شما)</small>' : ''}</h4>
              <div class="user-badges">${roleBadge}${subBadge}</div>
            </div>
          </div>
          <div class="user-info-grid">
            <div class="info-cell"><span>📞 شماره</span><strong dir="ltr">${escapeHtml(u.phone || '—')}</strong></div>
            <div class="info-cell"><span>📧 ایمیل</span><strong dir="ltr" style="font-size:.75rem;">${escapeHtml(u.email)}</strong></div>
            <div class="info-cell"><span>💰 موجودی</span><strong style="color:#ffc93c;">${formatMoney(u.balance || 0)}</strong></div>
            <div class="info-cell"><span>📅 عضویت</span><strong>${new Date(u.joinDate).toLocaleDateString('fa-IR')}</strong></div>
          </div>
          <div class="user-actions">${actions}</div>
        `;
        grid.appendChild(card);
      });

      grid.querySelectorAll('.admin-promote').forEach(btn => btn.addEventListener('click', () => promoteAdmin(parseInt(btn.dataset.id))));
      grid.querySelectorAll('.admin-revoke').forEach(btn => btn.addEventListener('click', () => revokeAdmin(parseInt(btn.dataset.id))));
      grid.querySelectorAll('.btn-gift').forEach(btn => btn.addEventListener('click', () => openGiftModal(parseInt(btn.dataset.id))));
      grid.querySelectorAll('.btn-revoke-sub').forEach(btn => btn.addEventListener('click', () => revokeSubscription(parseInt(btn.dataset.id))));
      grid.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => deleteUser(parseInt(btn.dataset.delete))));
    }

    function deleteUser(id) {
      const user = users.find(u => u.id === id);
      if (!user) return;
      if (user.email === ADMIN_EMAIL) return alert('❌ نمی‌تونی مدیر کل رو حذف کنی!');
      if (user.id === currentUser.id) return alert('❌ نمی‌تونی خودت رو حذف کنی!');
      const confirmText = prompt(`🗑️ حذف کامل «${user.fullname}»\n\n⚠️ همه اطلاعات پاک میشه!\nبرای تایید بنویس: DELETE`);
      if (confirmText !== 'DELETE') { if (confirmText !== null) alert('❌ لغو شد!'); return; }

      users = users.filter(u => u.id !== id);
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      items = items.filter(i => i.uploadedBy !== id && i.uploadedByEmail !== user.email);
      saveItems();
      alert(`✅ کاربر حذف شد!`);
      renderUsers(); renderItems(); updateStats();
    }

    function promoteAdmin(id) { const user = users.find(u => u.id === id); if (!user) return; if (!confirm(`🛡️ «${user.fullname}» ادمین بشه؟`)) return; user.role = 'admin'; saveUsers(); renderUsers(); updateStats(); }
    function revokeAdmin(id) { const user = users.find(u => u.id === id); if (!user) return; if (!confirm(`❌ از ادمینی مطمئنی؟`)) return; user.role = 'user'; saveUsers(); renderUsers(); updateStats(); }
    function revokeSubscription(id) { const user = users.find(u => u.id === id); if (!user) return; if (!confirm(`🚫 اشتراک لغو بشه؟`)) return; user.hasSubscription = false; saveUsers(); renderUsers(); updateStats(); }

    let giftTargetId = null;
    function openGiftModal(id) { const user = users.find(u => u.id === id); if (!user) return; giftTargetId = id; document.getElementById('giftUserName').textContent = user.fullname; document.getElementById('giftModal').classList.remove('hidden'); }
    document.getElementById('giftClose').addEventListener('click', () => { document.getElementById('giftModal').classList.add('hidden'); giftTargetId = null; });
    document.querySelectorAll('#giftModal .plan').forEach(plan => {
      plan.querySelector('.plan-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        const user = users.find(u => u.id === giftTargetId);
        if (!user) return;
        user.hasSubscription = true; user.subscriptionPlan = plan.dataset.plan; user.subscriptionExpiry = Date.now() + (parseInt(plan.dataset.days) * 24 * 60 * 60 * 1000);
        saveUsers(); document.getElementById('giftModal').classList.add('hidden'); renderUsers(); updateStats();
      });
    });

    function renderItems(search = '') {
      const adminItems = document.getElementById('adminItems');
      let list = [...items].sort((a, b) => b.time - a.time);
      if (search) list = list.filter(i => i.title.toLowerCase().includes(search));
      if (list.length === 0) { adminItems.innerHTML = '<div class="empty-grid">اثری پیدا نشد</div>'; return; }
      adminItems.innerHTML = '';
      list.forEach(item => {
        const uploader = users.find(u => u.id === item.uploadedBy || u.email === item.uploadedByEmail);
        const card = document.createElement('div'); card.className = 'item-card';
        card.innerHTML = `
          <div class="item-thumb"><img src="${item.image}" alt=""><button class="item-delete-btn" data-id="${item.id}">🗑️</button></div>
          <div class="item-info"><p class="item-title">${escapeHtml(item.title)}</p><p class="item-artist">👤 ${escapeHtml(uploader ? uploader.fullname : 'ناشناس')}</p></div>`;
        card.querySelector('.item-delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteItemAdmin(item.id); });
        adminItems.appendChild(card);
      });
    }
    function deleteItemAdmin(id) { if (!confirm('حذف بشه؟')) return; items = items.filter(i => i.id !== id); saveItems(); renderItems(); }

    function renderPayments() { document.getElementById('paymentsList').innerHTML = '<div class="empty-grid">درخواستی نیست</div>'; }
    function renderWithdraws() { document.getElementById('withdrawsList').innerHTML = '<div class="empty-grid">درخواستی نیست</div>'; }
    function renderSettings() { document.getElementById('commissionInput').value = settings.commissionRate; document.getElementById('maxPriceInput').value = settings.maxItemPrice; }
    document.getElementById('saveSettingsBtn').addEventListener('click', () => { settings.commissionRate = parseInt(document.getElementById('commissionInput').value); settings.maxItemPrice = parseInt(document.getElementById('maxPriceInput').value); localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); alert('✅ ذخیره شد!'); });

    function renderBottomNav() {
      const nav = document.getElementById('bottomNav'); if (!nav) return;
      nav.innerHTML = `
        <a href="home.html" class="nav-pill-btn"><span class="nav-pill-icon">🏠</span><span class="nav-pill-label">خانه</span></a>
        <a href="gallery.html" class="nav-pill-btn"><span class="nav-pill-icon">🎨</span><span class="nav-pill-label">گالری</span></a>
        <a href="admin.html" class="nav-pill-btn active"><span class="nav-pill-icon">🛡️</span><span class="nav-pill-label">مدیریت</span></a>
        <button class="nav-pill-btn" id="logoutNavBtn"><span class="nav-pill-icon">🚪</span><span class="nav-pill-label">خروج</span></button>`;
      nav.querySelector('#logoutNavBtn')?.addEventListener('click', () => { if (confirm('خارج بشی؟')) { localStorage.removeItem(CURRENT_KEY); window.location.href = 'home.html'; } });
    }

    // ✅ راه‌اندازی اولیه (نمایش لودینگ تا آمدن دیتا)
    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('adminMain').style.display = 'none';
    renderBottomNav();

  </script>

  <!-- 🔥 اتصال به دیتابیس ابری و لود دیتا قبل از نمایش صفحه -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdy1XEUDrVdgmyrr2r5nnvxaIP6A6y294",
      projectId: "navaa-409cb"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function syncAndLoad() {
      try {
        // 1. دریافت کاربران
        const usersRef = doc(db, 'navaa_storage', 'navaa_users');
        const usersSnap = await getDoc(usersRef);
        if (usersSnap.exists()) {
          window.users = JSON.parse(usersSnap.data().value);
          localStorage.setItem('navaa_users', usersSnap.data().value);
        }

        // 2. دریافت آثار
        const itemsRef = doc(db, 'navaa_storage', 'navaa_items_v3');
        const itemsSnap = await getDoc(itemsRef);
        if (itemsSnap.exists()) {
          window.items = JSON.parse(itemsSnap.data().value);
          localStorage.setItem('navaa_items_v3', itemsSnap.data().value);
        }

        // 3. حالا که دیتا اومد، نمایش بده
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('adminMain').style.display = 'block';
        
        // آپدیت کردن متغیرهای داخل اسکریپت اصلی و رندر
        if (typeof renderUsers === 'function') renderUsers();
        if (typeof renderItems === 'function') renderItems();
        if (typeof updateStats === 'function') updateStats();

      } catch (e) {
        console.error('خطا در دریافت اطلاعات:', e);
        document.getElementById('loadingBox').innerHTML = '<h2 style="color:red;">خطا در دریافت اطلاعات از سرور!</h2>';
      }
    }

    syncAndLoad();
  </script>
</body>
</html>
